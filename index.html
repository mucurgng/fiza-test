<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Физа: задания 2 и 3</title>
<meta name="description" content="Тренажёр по билетам по физиологии: задания 2 и 3 каждого билета с проверкой по эталону.">
<style>
:root{
  --bg:#f4f5f8;--card:#fff;--ink:#1b2130;--muted:#667085;--line:#e2e5ec;
  --acc:#2f63e0;--acc-ink:#fff;--acc-soft:#e8eefc;
  --ok:#15803d;--ok-bg:#e7f6ec;--bad:#c62828;--bad-bg:#fdecec;--chip:#eef0f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--card:#181c25;--ink:#e6e9ef;--muted:#98a1b1;--line:#2a303c;
  --acc:#6d95ff;--acc-ink:#0b0e14;--acc-soft:#1f2a44;
  --ok:#4ade80;--ok-bg:#132a1d;--bad:#f87171;--bad-bg:#301818;--chip:#232937;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{color:var(--muted);font-size:14px;white-space:nowrap}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}

/* home */
.hero{padding:28px 0 8px}
.hero h2{font-size:26px;margin:0 0 6px;line-height:1.2}
.hero p{margin:0;color:var(--muted)}
.sect{margin:22px 0 8px;font-weight:600}
.seg{display:grid;gap:8px}
.seg.cols3{grid-template-columns:repeat(3,1fr)}
.seg.cols2{grid-template-columns:repeat(2,1fr)}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.opt b{display:block;font-size:15px}
.opt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt.on{border-color:var(--acc);background:var(--acc-soft)}
@media (max-width:560px){.seg.cols3{grid-template-columns:1fr}}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--chip)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:14px;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.grid button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.grid button.cur{outline:2px solid var(--acc);outline-offset:1px}
.note{color:var(--muted);font-size:13px;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* quiz */
.ticket{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.ticket h2{margin:0;font-size:22px}
.ticket .res{font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card.ok{border-color:var(--ok)}
.card.bad{border-color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.tag em{font-style:normal;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.q{margin:0 0 12px;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.cardnote{color:var(--muted);font-style:italic}
.colh{font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px}
ol.ref{list-style:none;margin:0 0 6px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
ol.ref li{display:flex;gap:10px;padding:8px 10px;border-top:1px solid var(--line);font-size:15px}
ol.ref li:first-child{border-top:0}
.n{flex:0 0 auto;min-width:24px;height:24px;border-radius:7px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.row{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.row.ok{border-color:var(--ok);background:var(--ok-bg)}
.row.bad{border-color:var(--bad);background:var(--bad-bg)}
.rt{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:40px;height:38px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.right{box-shadow:inset 0 0 0 2px var(--ok)}
.chip:disabled{cursor:default}
.fix{margin-top:8px;font-size:14px;color:var(--ok);font-weight:600}
.fix.badc{color:var(--bad)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px;text-align:center;font-variant-numeric:tabular-nums}
.strip div{border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
.strip span{display:block;padding:4px 2px;font-size:13px}
.strip span:first-child{background:var(--chip);font-weight:700}
.strip span:last-child{font-weight:700;min-height:28px}
.strip .ok span:last-child{color:var(--ok);background:var(--ok-bg)}
.strip .bad span:last-child{color:var(--bad);background:var(--bad-bg)}
.item{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.item .t{flex:1}
.item .pos{flex:0 0 auto;min-width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
.item.on{border-color:var(--acc);background:var(--acc-soft)}
.item.on .pos{border:0;background:var(--acc);color:var(--acc-ink)}
.item:disabled{cursor:default}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.item.ok .pos{background:var(--ok);color:var(--card);border:0}
.item.bad .pos{background:var(--bad);color:var(--card);border:0}
.two{display:flex;gap:6px;flex:0 0 auto}
.answer{margin-top:10px;padding:10px;border-radius:10px;background:var(--ok-bg);font-size:14px}
.answer b{color:var(--ok)}
.answer ol{margin:6px 0 0;padding-left:20px}
.answer li{margin:2px 0}
.small{font-size:13px;color:var(--muted)}

.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 14px);padding:20px 0 calc(12px + env(safe-area-inset-bottom))}
.actions .wrap{display:flex;gap:8px}
.actions .btn{flex:0 0 auto}
.actions .btn.pri{flex:1}

/* done */
.big{font-size:44px;font-weight:800;margin:6px 0 0;font-variant-numeric:tabular-nums}
.stat{color:var(--muted)}
.list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:780px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>

  <div class="wrap">
    <h1 id="title">Физа · задания 2 и 3</h1>
    <span class="meta" id="meta"></span>

    <button class="ghost hidden" id="btnMenu" type="button">Меню</button>

  </section>

  <section id="quiz" class="hidden">
    <div class="ticket"><h2 id="tNum"></h2><span class="res" id="tRes"></span></div>
    <div id="cards"></div>
  </section>

  <section id="done" class="hidden"></section>
</main>

<div class="actions hidden" id="actions">
  <div class="wrap">
    <button class="btn" id="btnPrev" type="button" aria-label="Предыдущий билет">←</button>
    <button class="btn" id="btnReset" type="button">Заново</button>
    <button class="btn pri" id="btnMain" type="button">Проверить</button>
  </div>
</div>

<div class="ov hidden" id="ov">
  <div class="sheet">
    <h3><span>Перейти к билету</span><button class="ghost" id="ovClose" type="button">Закрыть</button></h3>
    <div class="grid" id="ovGrid"></div>
  </div>
</div>

</script>
<script>
"use strict";
const LET = "АБВГДЕЖЗИК";
const DATA = TICKETS.map(t => ({ n: t.n, t2: t.t2, t3: t.t3 === "same" ? Object.assign({ dup: true }, t.t2) : t.t3 }));
const MODES = {
  both: { title: "Билет целиком", sub: "Задания 2 и 3 вместе", parts: [2, 3] },
  t2:   { title: "Только задания 2", sub: "Отдельный тест", parts: [2] },
  t3:   { title: "Только задания 3", sub: "Отдельный тест", parts: [3] }
};
const ORDERS = { seq: { title: "По порядку", sub: "С 1-го билета" }, rnd: { title: "Вперемешку", sub: "Случайный порядок" } };
const KIND = { m: "соответствие", mm: "соответствие", ms: "соответствие и порядок", s: "последовательность", c: "распределить по группам", p: "выбрать верные" };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const digits = s => String(s).split("").map(Number);

let pick = { mode: "both", order: "seq" };
let st = null;

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function save() { if (st) store("fiza23:" + st.mode, st); }
function load(mode) { const s = store("fiza23:" + mode); return s && Array.isArray(s.order) && s.order.length ? s : null; }

function tasksOf(mode, n) {
  const t = DATA[n - 1], out = [];
  for (const p of MODES[mode].parts) {
    const task = t["t" + p];
    if (!task) { if (mode === "both") out.push({ p, note: "В файле у этого билета нет задания 3." }); continue; }
    if (mode === "both" && p === 3 && task.dup) { out.push({ p, note: "В этом билете задание 3 такое же, как задание 2." }); continue; }
    out.push({ p, task, key: n + "-" + p });
  }
  return out;
}
function ticketsFor(mode) { return DATA.filter(t => tasksOf(mode, t.n).some(x => x.task)).map(t => t.n); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function blank(task) {
  switch (task.k) {
    case "m": return { sel: task.L.map(() => null) };
    case "mm": return { sel: task.L.map(() => []) };
    case "ms": return { sel: task.L.map(() => null), seq: [] };
    case "s": return { seq: [] };
    case "c": return { sel: task.I.map(() => null) };
    case "p": return { sel: task.I.map(() => false) };
  }
}
function ans(key, task) { if (!st.A[key]) st.A[key] = blank(task); return st.A[key]; }

function evaluate(task, a) {
  const rows = [], seq = [];
  if (task.k === "m" || task.k === "ms") digits(task.a).forEach((v, i) => rows.push(a.sel[i] === v));
  if (task.k === "ms") task.o.split("").forEach((ch, i) => seq.push(a.seq[i] !== undefined && LET[a.seq[i]] === ch));
  if (task.k === "s") digits(task.a).forEach((v, i) => seq.push(a.seq[i] === v));
  if (task.k === "mm") task.a.forEach((s, i) => rows.push(digits(s).sort().join() === a.sel[i].slice().sort().join()));
  if (task.k === "c") task.I.forEach((_, k) => rows.push(a.sel[k] === (task.a[0].includes(k + 1) ? 0 : 1)));
  if (task.k === "p") task.I.forEach((_, k) => rows.push(a.sel[k] === task.a.includes(k + 1)));
  const all = rows.concat(seq), got = all.filter(Boolean).length;
  return { rows, seq, got, tot: all.length, ok: got === all.length };
}
function filled(task, a) {
  if (task.k === "m") return a.sel.every(v => v !== null);
  if (task.k === "mm") return a.sel.every(v => v.length > 0);
  if (task.k === "ms") return a.sel.every(v => v !== null) && a.seq.length === task.L.length;
  if (task.k === "s") return a.seq.length === task.I.length;
  if (task.k === "c") return a.sel.every(v => v !== null);
  return a.sel.some(Boolean);
}

/* ---------- rendering of one task ---------- */
function refList(items, head) {
  return (head ? `<div class="colh">${esc(head)}</div>` : "") +
    `<ol class="ref">${items.map((t, i) => `<li><span class="n">${i + 1}</span><span>${esc(t)}</span></li>`).join("")}</ol>`;
}
function strip(labels, vals, marks) {
  return `<div class="strip">${labels.map((l, i) =>
    `<div class="${marks ? (marks[i] ? "ok" : "bad") : ""}"><span>${esc(l)}</span><span>${vals[i] === null || vals[i] === undefined || vals[i] === "" ? "&nbsp;" : esc(vals[i])}</span></div>`).join("")}</div>`;
}
function seqItems(key, labels, texts, seq, checked, ev, act) {
  return texts.map((t, i) => {
    const val = act === "s" ? i + 1 : i, pos = seq.indexOf(val);
    let cls = pos >= 0 ? "on" : "";
    if (checked && pos >= 0) cls = ev.seq[pos] ? "ok" : "bad";
    return `<button type="button" class="item ${cls}" data-act="${act}" data-key="${key}" data-v="${val}" ${checked ? "disabled" : ""}>
      <span class="n">${esc(labels[i])}</span><span class="t">${esc(t)}</span><span class="pos">${pos >= 0 ? pos + 1 : ""}</span></button>`;
  }).join("");
}

function renderTask(x) {
  const { p, task, key } = x;
  const head = `<div class="tag">Задание ${p} <em>· ${KIND[task.k]}</em></div><p class="q">${esc(task.q)}</p>`;
  const a = ans(key, task), res = st.R[key], checked = !!res, ev = checked ? evaluate(task, a) : null;
  let body = "";

  if (task.k === "m" || task.k === "ms" || task.k === "mm") {
    const exp = task.k === "mm" ? task.a.map(digits) : digits(task.a);
    body += refList(task.R, task.h[1]);
    body += `<div class="colh">${esc(task.h[0])} — выберите номер ${task.k === "mm" ? "(по два на строку)" : ""}</div>`;
    body += task.L.map((l, i) => {
      const rowCls = checked ? (ev.rows[i] ? "ok" : "bad") : "";
      const chips = task.R.map((_, j) => {
        const v = j + 1, on = task.k === "mm" ? a.sel[i].includes(v) : a.sel[i] === v;
        const right = checked && !ev.rows[i] && (task.k === "mm" ? exp[i].includes(v) : exp[i] === v);
        return `<button type="button" class="chip ${on ? "on" : ""} ${right ? "right" : ""}" data-act="${task.k === "mm" ? "mm" : "m"}" data-key="${key}" data-i="${i}" data-v="${v}" ${checked ? "disabled" : ""}>${v}</button>`;
      }).join("");
      let fix = "";
      const chosen = task.k === "mm" ? a.sel[i].slice().sort() : (a.sel[i] === null ? [] : [a.sel[i]]);
      if (chosen.length && !(checked && !ev.rows[i])) fix = `<div class="small" style="margin-top:6px">→ ${chosen.map(v => esc(task.R[v - 1])).join("; ")}</div>`;
      if (checked && !ev.rows[i]) {
        const e = task.k === "mm" ? exp[i] : [exp[i]];
        fix = `<div class="fix">Верно: ${e.map(v => v + " — " + esc(task.R[v - 1])).join("; ")}</div>`;
      }
      return `<div class="row ${rowCls}"><div class="rt"><span class="n">${LET[i]}</span><span>${esc(l)}</span></div><div class="chips">${chips}</div>${fix}</div>`;
    }).join("");
    const vals = task.L.map((_, i) => task.k === "mm" ? a.sel[i].slice().sort().join(",") : a.sel[i]);
    body += strip(task.L.map((_, i) => LET[i]), vals, checked ? ev.rows : null);
    if (checked && task.k !== "ms" && !ev.ok) body += `<div class="answer"><b>Эталон:</b> ${task.L.map((_, i) => LET[i] + "&nbsp;" + (task.k === "mm" ? task.a[i].split("").join(",") : exp[i])).join(" · ")}</div>`;
  }

  if (task.k === "ms") {
    body += `<div class="colh">Порядок фаз: нажимайте на фазы по очереди</div>`;
    body += seqItems(key, task.L.map((_, i) => LET[i]), task.L, a.seq, checked, ev, "ms");
    body += strip(task.L.map((_, i) => i + 1 + ""), task.L.map((_, i) => a.seq[i] !== undefined ? LET[a.seq[i]] : null), checked ? ev.seq : null);
    if (checked && !ev.ok) body += `<div class="answer"><b>Эталон:</b> соответствие ${digits(task.a).map((v, i) => LET[i] + "&nbsp;" + v).join(" · ")}; порядок ${task.o.split("").join(" → ")}</div>`;
  }

  if (task.k === "s") {
    body += `<p class="hint">Нажимайте на пункты в правильном порядке. Повторное нажатие убирает пункт.</p>`;
    body += seqItems(key, task.I.map((_, i) => i + 1 + ""), task.I, a.seq, checked, ev, "s");
    body += strip(task.I.map((_, i) => i + 1 + ""), task.I.map((_, i) => a.seq[i] ?? null), checked ? ev.seq : null);
    if (checked && !ev.ok) body += `<div class="answer"><b>Эталон: ${digits(task.a).join(" ")}</b><ol>${digits(task.a).map(v => `<li>${esc(task.I[v - 1])}</li>`).join("")}</ol></div>`;
  }

  if (task.k === "c") {
    body += `<div class="colh">${task.G.map((g, i) => LET[i] + " — " + esc(g)).join("<br>")}</div>`;
    body += task.I.map((t, k) => {
      const exp = task.a[0].includes(k + 1) ? 0 : 1;
      const rowCls = checked ? (ev.rows[k] ? "ok" : "bad") : "";
      const btns = task.G.map((_, g) => `<button type="button" class="chip ${a.sel[k] === g ? "on" : ""} ${checked && !ev.rows[k] && exp === g ? "right" : ""}" data-act="c" data-key="${key}" data-i="${k}" data-v="${g}" ${checked ? "disabled" : ""}>${LET[g]}</button>`).join("");
      return `<div class="row ${rowCls}"><div class="rt" style="margin:0;align-items:center"><span class="n">${k + 1}</span><span style="flex:1">${esc(t)}</span><span class="two">${btns}</span></div>${checked && !ev.rows[k] ? `<div class="fix">Верно: ${LET[exp]}</div>` : ""}</div>`;
    }).join("");
    if (checked && !ev.ok) body += `<div class="answer">${task.G.map((g, i) => `<b>${LET[i]}:</b> ${task.a[i].join(", ")}`).join("<br>")}</div>`;
  }

  if (task.k === "p") {
    body += `<p class="hint">Отметьте все подходящие пункты.</p>`;
    body += task.I.map((t, k) => {
      const exp = task.a.includes(k + 1);
      let cls = a.sel[k] ? "on" : "";
      if (checked) cls = ev.rows[k] ? (exp ? "ok" : "") : "bad";
      return `<button type="button" class="item ${cls}" data-act="p" data-key="${key}" data-i="${k}" ${checked ? "disabled" : ""}><span class="n">${k + 1}</span><span class="t">${esc(t)}</span><span class="pos">${a.sel[k] ? "✓" : ""}</span></button>`;
    }).join("");
    if (checked && !ev.ok) body += `<div class="answer"><b>Эталон: ${task.a.join(", ")}</b></div>`;
  }

  let verdict = "";
  if (checked) verdict = `<div class="fix ${ev.ok ? "" : "badc"}" style="margin-top:12px">${ev.ok ? "Верно" : "Есть ошибки"} · ${ev.got} из ${ev.tot}</div>`;
  return `<div class="card ${checked ? (ev.ok ? "ok" : "bad") : ""}" id="card-${key}">${head}${body}${verdict}</div>`;
}

/* ---------- screens ---------- */
function show(id) {
  for (const s of ["home", "quiz", "done"]) $(s).classList.toggle("hidden", s !== id);
  $("actions").classList.toggle("hidden", id !== "quiz");
  $("btnMenu").classList.toggle("hidden", id === "home");
  $("btnGrid").classList.toggle("hidden", id !== "quiz");
  window.scrollTo(0, 0);
}
function ticketState(s, n) {
  const xs = tasksOf(s.mode, n).filter(x => x.task);
  if (!xs.every(x => s.R[x.key])) return xs.some(x => s.R[x.key]) ? (xs.some(x => s.R[x.key] && !s.R[x.key].ok) ? "bad" : "") : "";
  return xs.every(x => s.R[x.key].ok) ? "ok" : "bad";
}
function gridHTML(s, list, cur) {
  return list.map(n => `<button type="button" data-go="${n}" class="${s ? ticketState(s, n) : ""} ${n === cur ? "cur" : ""}">${n}</button>`).join("");
}

function renderHome() {
  $("title").textContent = "Физа · задания 2 и 3";
  $("meta").textContent = "";
  $("barFill").style.width = "0";
  $("modeSeg").innerHTML = Object.entries(MODES).map(([k, m]) => `<button type="button" class="opt ${pick.mode === k ? "on" : ""}" data-mode="${k}"><b>${m.title}</b><span>${m.sub} · ${ticketsFor(k).length} бил.</span></button>`).join("");
  $("orderSeg").innerHTML = Object.entries(ORDERS).map(([k, o]) => `<button type="button" class="opt ${pick.order === k ? "on" : ""}" data-order="${k}"><b>${o.title}</b><span>${o.sub}</span></button>`).join("");
  const saved = load(pick.mode);
  let cta = `<button type="button" class="btn pri" id="btnStart">Начать заново</button>`;
  if (saved) {
    const done = Object.keys(saved.R).length;
    cta = `<button type="button" class="btn pri" id="btnCont">Продолжить: билет ${saved.order[Math.min(saved.pos, saved.order.length - 1)]}</button>` +
          `<button type="button" class="btn" id="btnStart">Начать заново</button>` +
          `<span class="note" style="align-self:center">проверено заданий: ${done}</span>`;
  }
  $("cta").innerHTML = cta;
  $("homeGrid").innerHTML = gridHTML(saved, ticketsFor(pick.mode));
  show("home");
}

function start(fresh, order) {
  const list = ticketsFor(pick.mode);
  if (!fresh && load(pick.mode)) st = load(pick.mode);
  else st = { mode: pick.mode, order: order || (pick.order === "rnd" ? shuffle(list) : list), pos: 0, A: {}, R: {} };
  save(); renderQuiz();
}
function openTicket(n) {
  const saved = load(pick.mode);
  st = saved || { mode: pick.mode, order: ticketsFor(pick.mode), pos: 0, A: {}, R: {} };
  let i = st.order.indexOf(n);
  if (i < 0) { st.order = ticketsFor(pick.mode); i = st.order.indexOf(n); }
  st.pos = i; save(); renderQuiz();
}

function renderQuiz() {
  const n = st.order[st.pos], xs = tasksOf(st.mode, n);
  $("title").textContent = MODES[st.mode].title;
  $("meta").textContent = `${st.pos + 1} / ${st.order.length}`;
  $("barFill").style.width = ((st.pos + 1) / st.order.length * 100) + "%";
  $("tNum").textContent = "Билет " + n;
  $("cards").innerHTML = xs.map(x => x.task ? renderTask(x) : `<div class="card"><div class="tag">Задание ${x.p}</div><p class="cardnote">${esc(x.note)}</p></div>`).join("");
  updateBar();
  show("quiz");
}
function updateBar() {
  const n = st.order[st.pos], xs = tasksOf(st.mode, n).filter(x => x.task);
  const checked = xs.every(x => st.R[x.key]);
  $("btnMain").textContent = checked ? (st.pos + 1 < st.order.length ? "Дальше →" : "Итоги") : "Проверить";
  $("btnPrev").disabled = st.pos === 0;
  const r = $("tRes");
  if (checked) {
    const ok = xs.filter(x => st.R[x.key].ok).length;
    r.textContent = ok === xs.length ? "✓ всё верно" : `верно ${ok} из ${xs.length}`;
    r.style.color = ok === xs.length ? "var(--ok)" : "var(--bad)";
  } else r.textContent = "";
}
function rerenderCard(key) {
  const [n, p] = key.split("-").map(Number);
  const x = tasksOf(st.mode, n).find(y => y.p === p);
  const el = $("card-" + key);
  if (el && x) el.outerHTML = renderTask(x);
}

function check() {
  const n = st.order[st.pos], xs = tasksOf(st.mode, n).filter(x => x.task);
  const pending = xs.filter(x => !st.R[x.key]);
  if (!pending.length) { next(); return; }
  const empty = pending.filter(x => !filled(x.task, ans(x.key, x.task)));
  if (empty.length && !confirm("Ответ заполнен не полностью. Всё равно проверить?")) return;
  for (const x of pending) { const e = evaluate(x.task, ans(x.key, x.task)); st.R[x.key] = { ok: e.ok, got: e.got, tot: e.tot }; }
  save(); renderQuiz();
  const first = document.querySelector(".card.bad");
  if (first) first.scrollIntoView({ behavior: "smooth", block: "start" });
}
function next() {
  if (st.pos + 1 < st.order.length) { st.pos++; save(); renderQuiz(); }
  else renderDone();
}
function resetTicket() {
  const n = st.order[st.pos];
  for (const x of tasksOf(st.mode, n)) if (x.key) { delete st.A[x.key]; delete st.R[x.key]; }
  save(); renderQuiz();
}

function renderDone() {
  const xs = st.order.flatMap(n => tasksOf(st.mode, n).filter(x => x.task));
  const done = xs.filter(x => st.R[x.key]), ok = done.filter(x => st.R[x.key].ok);
  const bad = st.order.filter(n => ticketState(st, n) === "bad");
  const skipped = st.order.filter(n => tasksOf(st.mode, n).some(x => x.task && !st.R[x.key]));
  const pct = xs.length ? Math.round(ok.length / xs.length * 100) : 0;
  $("meta").textContent = "";
  $("done").innerHTML = `
    <div class="hero"><h2>Итоги · ${esc(MODES[st.mode].title.toLowerCase())}</h2></div>
    <div class="card">
      <div class="stat">Полностью верно</div>
      <div class="big">${ok.length} <span style="font-size:22px;color:var(--muted)">из ${xs.length}</span></div>
      <div class="stat">${pct}% заданий · проверено ${done.length}</div>
    </div>
    ${bad.length ? `<div class="sect">Билеты с ошибками (${bad.length})</div><div class="grid">${gridHTML(st, bad)}</div>` : ""}
    ${skipped.length ? `<div class="sect">Не проверены (${skipped.length})</div><div class="grid">${gridHTML(st, skipped)}</div>` : ""}
    <div class="cta">
      ${bad.length ? `<button type="button" class="btn pri" id="btnRetry">Прорешать ошибки ещё раз</button>` : ""}
      <button type="button" class="btn ${bad.length ? "" : "pri"}" id="btnAgain">Начать заново</button>
    </div>`;
  show("done");
}
function retryBad() {
  const bad = st.order.filter(n => ticketState(st, n) === "bad");
  for (const n of bad) for (const x of tasksOf(st.mode, n)) if (x.key) { delete st.A[x.key]; delete st.R[x.key]; }
  st.order = bad; st.pos = 0; save(); renderQuiz();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.mode) { pick.mode = b.dataset.mode; store("fiza23:pick", pick); renderHome(); return; }
  if (b.dataset.order) { pick.order = b.dataset.order; store("fiza23:pick", pick); renderHome(); return; }
  if (b.dataset.go) {
    const n = +b.dataset.go; $("ov").classList.add("hidden");
    if (st && !$("home").classList.contains("hidden")) st = null;
    if (st) { const i = st.order.indexOf(n); if (i >= 0) { st.pos = i; save(); renderQuiz(); return; } }
    openTicket(n); return;
  }
  const act = b.dataset.act;
  if (act) {
    const key = b.dataset.key, [n, p] = key.split("-").map(Number);
    const task = tasksOf(st.mode, n).find(y => y.p === p).task, a = ans(key, task);
    const i = +b.dataset.i, v = +b.dataset.v;
    if (act === "m") a.sel[i] = a.sel[i] === v ? null : v;
    if (act === "mm") { const s = a.sel[i]; const k = s.indexOf(v); if (k >= 0) s.splice(k, 1); else s.push(v); }
    if (act === "c") a.sel[i] = a.sel[i] === v ? null : v;
    if (act === "p") a.sel[i] = !a.sel[i];
    if (act === "s" || act === "ms") { const k = a.seq.indexOf(v); if (k >= 0) a.seq.splice(k, 1); else a.seq.push(v); }
    save(); rerenderCard(key); return;
  }
  switch (b.id) {
    case "btnStart": start(true); break;
    case "btnCont": start(false); break;
    case "btnMain": check(); break;
    case "btnPrev": if (st.pos > 0) { st.pos--; save(); renderQuiz(); } break;
    case "btnReset": resetTicket(); break;
    case "btnMenu": st = null; renderHome(); break;
    case "btnGrid": $("ovGrid").innerHTML = gridHTML(st, st.order, st.order[st.pos]); $("ov").classList.remove("hidden"); break;
    case "ovClose": $("ov").classList.add("hidden"); break;
    case "btnRetry": retryBad(); break;
    case "btnAgain": st = null; renderHome(); break;
  }
});
$("ov").addEventListener("click", e => { if (e.target.id === "ov") $("ov").classList.add("hidden"); });

const savedPick = store("fiza23:pick");
if (savedPick && MODES[savedPick.mode] && ORDERS[savedPick.order]) pick = savedPick;
renderHome();
</script>
</body>
